name: What If Systems Shorts

on:
  push:
    branches: [feature/what-if-system-shorts]
    paths-ignore: ['services/topic_progress.json']
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 3 * * *'   # 09:00 IST
    - cron: '30 7 * * *'   # 13:00 IST
    - cron: '30 14 * * *'  # 20:00 IST
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish one Short publicly (false renders a preview artifact)'
        type: boolean
        required: true
        default: true
      topic_id:
        description: 'Topic ID 1-100; leave blank for the next queued topic'
        type: string
        required: false
        default: ''

concurrency:
  group: youtube-upload
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  short:
    name: Check and render one Short
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install local rendering and speech tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install neural speech engine
        run: python -m pip install -r requirements-voice.txt
      - name: Test the complete 100-topic catalog and renderer
        run: npm test
      - name: Render preview or publish a public Short
        env:
          TOPIC_ID: ${{ inputs.topic_id || '' }}
          PUBLISH_SHORT: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
          TTS_PROVIDER: edge
          TTS_VOICE: en-US-AndrewMultilingualNeural
          TTS_RATE: '+8%'
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/run-ci-short.js
      - name: Save video and review material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: what-if-short-${{ github.run_number }}
          path: |
            storage/finalVideo.mp4
            storage/script.txt
            storage/storyboard.json
          if-no-files-found: warn
          retention-days: 14
      - name: Record progress on the branch that published
        if: success() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish))
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add services/topic_progress.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Advance Shorts topic progress [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
